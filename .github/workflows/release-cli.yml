name: release-cli

# `v*` etiketi (ör. v0.1.0) ya da elle çalıştırma: 4 hedef için CLI derler, sixfinger-<os>-<arch>.tar.gz olarak GitHub Release'e yükler.
# site/install bu dosya adlarını indirir.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Sürüm (ör. 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, os: linux, arch: x64 }
          - { runner: ubuntu-24.04-arm, os: linux, arch: arm64 }
          - { runner: macos-15-intel, os: darwin, arch: x64 }
          - { runner: macos-latest, os: darwin, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Sürüm
        id: v
        run: |
          V="${{ github.event.inputs.version }}"
          [ -z "$V" ] && V="${GITHUB_REF_NAME#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile || bun install
      - name: Derle
        working-directory: packages/sixfinger
        env:
          SIXFINGER_VERSION: ${{ steps.v.outputs.version }}
          SIXFINGER_CHANNEL: latest
        run: bun run build --single --skip-install
      - name: Paketle
        run: |
          BIN="$(find packages/sixfinger/dist -type f -path '*/bin/sixfinger' | head -n 1)"
          test -n "$BIN" || { echo "ikili bulunamadı"; exit 1; }
          tar -czf "sixfinger-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" -C "$(dirname "$BIN")" sixfinger
      - uses: actions/upload-artifact@v4
        with:
          name: sixfinger-${{ matrix.os }}-${{ matrix.arch }}
          path: sixfinger-${{ matrix.os }}-${{ matrix.arch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          files: dist/*.tar.gz
          generate_release_notes: true
