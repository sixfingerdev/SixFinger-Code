name: sixfinger

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  sixfinger:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /sixfinger') ||
      startsWith(github.event.comment.body, '/sixfinger')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun

      - name: Run sixfinger
        uses: sixfingerdev/sixfinger-code/github@2c14fc5586fe0b88e5c04732d2e846769cc35671 # latest
        env:
          SIXFINGER_API_KEY: ${{ secrets.SIXFINGER_API_KEY }}
          SIXFINGER_PERMISSION: '{"bash": "deny"}'
        with:
          model: sixfinger/claude-opus-4-5
